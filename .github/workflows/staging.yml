name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, home-server]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t tara-api:staging .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t tara-web:staging .

      - name: Redeploy staging stack
        run: |
          docker compose -f infra/portainer/stacks/tara-staging.yml \
            up -d --force-recreate web api cloudflared

      - name: Smoke test
        run: |
          echo "Waiting for services to be ready..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://staging.tara-stays.com/en)
          API=$(curl -s --max-time 10 https://api.staging.tara-stays.com/health || echo '{"status":"error"}')
          API_STATUS=$(echo "$API" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','error'))" 2>/dev/null || echo "error")
          echo "Web: $STATUS | API: $API_STATUS"
          [ "$STATUS" = "200" ] && [ "$API_STATUS" = "ok" ] || (echo "Smoke test failed" && exit 1)
