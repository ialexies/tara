name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, home-server]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t tara-api:staging .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t tara-web:staging .

      - name: Redeploy staging stack
        run: |
          docker compose -f infra/portainer/stacks/tara-staging.yml \
            up -d --force-recreate web api cloudflared

      - name: Smoke test
        run: |
          echo "Waiting for services to be ready..."
          sleep 20
          # Check web via Cloudflare
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://staging.tara-stays.com/en)
          # Check API directly via Docker (avoids network routing issues in runner container)
          API_STATUS=$(docker exec tara-staging-api-1 node -e \
            "fetch('http://localhost:4000/health').then(r=>r.json()).then(d=>process.stdout.write(d.status)).catch(()=>process.stdout.write('error'))" \
            2>/dev/null || echo "error")
          echo "Web: $STATUS | API: $API_STATUS"
          [ "$STATUS" = "200" ] && [ "$API_STATUS" = "ok" ] || (echo "Smoke test failed" && exit 1)
