name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  test:
    runs-on: [self-hosted, home-server]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @tara/schemas build && pnpm --filter @tara/db build && pnpm --filter @tara/auth build

      - name: Unit tests
        run: pnpm --filter @tara/auth test && pnpm --filter @tara/api test

  deploy:
    needs: test
    runs-on: [self-hosted, home-server]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t tara-api:staging .

      - name: Build Web image
        # NEXT_PUBLIC_* vars are baked into the Next.js build at image build time.
        # Firebase client config is public (not secret) — safe to bake in.
        run: |
          read_env() {
            docker run --rm \
              -v /home/ialexies/stacks/tara-staging:/env:ro \
              alpine sh -c "grep ^$1= /env/.env | cut -d= -f2-"
          }
          docker build \
            -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api-staging.tara-stays.com \
            --build-arg R2_PUBLIC_URL="$(read_env R2_PUBLIC_URL)" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$(read_env NEXT_PUBLIC_FIREBASE_API_KEY)" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$(read_env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$(read_env NEXT_PUBLIC_FIREBASE_PROJECT_ID)" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$(read_env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$(read_env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$(read_env NEXT_PUBLIC_FIREBASE_APP_ID)" \
            -t tara-web:staging .

      - name: Run DB migrations
        run: |
          docker exec tara-staging-postgres-1 psql -U tara -d tara_staging \
            -c "CREATE EXTENSION IF NOT EXISTS citext;" 2>/dev/null || true
          for f in packages/db/migrations/*.sql; do
            TAG=$(basename "$f" .sql)
            APPLIED=$(docker exec tara-staging-postgres-1 psql -U tara -d tara_staging -At \
              -c "SELECT 1 FROM drizzle.__drizzle_migrations WHERE tag='$TAG' LIMIT 1" 2>/dev/null || echo "")
            if [ -z "$APPLIED" ]; then
              echo "Applying $TAG..."
              docker cp "$f" tara-staging-postgres-1:/tmp/migration.sql
              docker exec tara-staging-postgres-1 psql -U tara -d tara_staging -f /tmp/migration.sql
              docker exec tara-staging-postgres-1 psql -U tara -d tara_staging \
                -c "INSERT INTO drizzle.__drizzle_migrations (hash, created_at) VALUES ('$TAG', extract(epoch from now())*1000) ON CONFLICT DO NOTHING;" 2>/dev/null || true
            fi
          done

      - name: Redeploy staging stack via Portainer
        run: |
          PORTAINER_URL="https://192.168.0.253:9443"
          PORTAINER_TOKEN="ptr_ejo0JsEI7qy5b90GsEpDrPPUX9Wu6kwWXRYiDWc8ndA="

          # Find the tara-staging stack ID and endpoint ID
          STACK_JSON=$(curl -sk -H "X-API-Key: $PORTAINER_TOKEN" "$PORTAINER_URL/api/stacks")
          STACK_ID=$(echo "$STACK_JSON" | python3 -c "
          import json,sys
          s = next(s for s in json.load(sys.stdin) if s['Name']=='tara-staging')
          print(s['Id'])
          ")
          ENDPOINT_ID=$(echo "$STACK_JSON" | python3 -c "
          import json,sys
          s = next(s for s in json.load(sys.stdin) if s['Name']=='tara-staging')
          print(s['EndpointId'])
          ")

          # Fetch current env vars from Portainer so we don't lose any set via the UI
          CURRENT_ENV=$(curl -sk -H "X-API-Key: $PORTAINER_TOKEN" \
            "$PORTAINER_URL/api/stacks/$STACK_ID" | \
            python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin).get('Env', [])))")

          # Update stack with latest compose file, preserving env vars from Portainer UI
          COMPOSE=$(python3 -c "import json; print(json.dumps(open('infra/portainer/stacks/tara-staging.yml').read()))")

          HTTP_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -X PUT \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            -H "Content-Type: application/json" \
            "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -d "{\"stackFileContent\": $COMPOSE, \"env\": $CURRENT_ENV, \"prune\": false}")

          echo "Portainer redeploy status: $HTTP_STATUS"
          [ "$HTTP_STATUS" = "200" ] || (echo "Portainer redeploy failed" && exit 1)

      - name: Smoke test
        run: |
          echo "Waiting for services to be ready..."
          sleep 20
          echo "--- Container states ---"
          docker ps --filter "name=tara-staging" --format "{{.Names}} {{.Status}}"
          echo "--- API last 30 log lines ---"
          docker logs --tail 30 tara-staging-api-1 2>&1 || echo "(no logs)"
          echo "--- Checks ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://staging.tara-stays.com/en)
          API_STATUS=$(docker exec tara-staging-api-1 node -e \
            "fetch('http://localhost:4000/health').then(r=>r.json()).then(d=>process.stdout.write(d.status)).catch((e)=>process.stdout.write('error:'+e.message))" \
            2>&1 || echo "exec-failed")
          echo "Web: $STATUS | API: $API_STATUS"
          [ "$STATUS" = "200" ] && [ "$API_STATUS" = "ok" ] || (echo "Smoke test failed" && exit 1)

  e2e:
    needs: deploy
    runs-on: [self-hosted, home-server]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright + system deps
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Run E2E tests against staging
        run: PLAYWRIGHT_BASE_URL=https://staging.tara-stays.com npx playwright test --project=mobile-chrome
        working-directory: apps/web
