name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  test:
    runs-on: [self-hosted, home-server]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @tara/schemas build && pnpm --filter @tara/db build && pnpm --filter @tara/auth build

      - name: Unit tests (auth + schemas)
        run: pnpm --filter @tara/auth test && pnpm --filter @tara/schemas test

      - name: Integration tests (API)
        run: pnpm --filter @tara/api test

  deploy:
    needs: test
    runs-on: [self-hosted, home-server]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t tara-api:staging .

      - name: Build Web image
        # NEXT_PUBLIC_* vars are baked into the Next.js build at image build time.
        # R2_PUBLIC_URL is needed for next/image remotePatterns.
        run: |
          R2_URL=$(docker run --rm \
            -v /home/ialexies/stacks/tara-staging:/env:ro \
            alpine sh -c "grep ^R2_PUBLIC_URL /env/.env | cut -d= -f2-")
          docker build \
            -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api.staging.tara-stays.com \
            --build-arg R2_PUBLIC_URL="${R2_URL}" \
            -t tara-web:staging .

      - name: Run DB migrations
        run: |
          docker exec tara-staging-postgres-1 psql -U tara -d tara_staging \
            -c "CREATE EXTENSION IF NOT EXISTS citext;" 2>/dev/null || true
          for f in packages/db/migrations/*.sql; do
            TAG=$(basename "$f" .sql)
            APPLIED=$(docker exec tara-staging-postgres-1 psql -U tara -d tara_staging -At \
              -c "SELECT 1 FROM drizzle.__drizzle_migrations WHERE tag='$TAG' LIMIT 1" 2>/dev/null || echo "")
            if [ -z "$APPLIED" ]; then
              echo "Applying $TAG..."
              docker cp "$f" tara-staging-postgres-1:/tmp/migration.sql
              docker exec tara-staging-postgres-1 psql -U tara -d tara_staging -f /tmp/migration.sql
              docker exec tara-staging-postgres-1 psql -U tara -d tara_staging \
                -c "INSERT INTO drizzle.__drizzle_migrations (hash, created_at) VALUES ('$TAG', extract(epoch from now())*1000) ON CONFLICT DO NOTHING;" 2>/dev/null || true
            fi
          done

      - name: Redeploy staging stack
        run: |
          # Read all secrets from host .env into an env file the runner can use.
          # The runner is containerised (Docker socket mounted) so host paths are
          # accessed via a temporary alpine sidecar.
          docker run --rm \
            -v /home/ialexies/stacks/tara-staging:/env:ro \
            alpine sh -c "cat /env/.env" > /tmp/staging-secrets.env

          docker compose \
            -p tara-staging \
            -f infra/portainer/stacks/tara-staging.yml \
            --env-file /tmp/staging-secrets.env \
            up -d --force-recreate web api cloudflared

          rm -f /tmp/staging-secrets.env

      - name: Smoke test
        run: |
          echo "Waiting for services to be ready..."
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://staging.tara-stays.com/en)
          API_STATUS=$(docker exec tara-staging-api-1 node -e \
            "fetch('http://localhost:4000/health').then(r=>r.json()).then(d=>process.stdout.write(d.status)).catch(()=>process.stdout.write('error'))" \
            2>/dev/null || echo "error")
          echo "Web: $STATUS | API: $API_STATUS"
          [ "$STATUS" = "200" ] && [ "$API_STATUS" = "ok" ] || (echo "Smoke test failed" && exit 1)

  e2e:
    needs: deploy
    runs-on: [self-hosted, home-server]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright + system deps
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Run E2E tests against staging
        run: PLAYWRIGHT_BASE_URL=https://staging.tara-stays.com npx playwright test --project=mobile-chrome
        working-directory: apps/web
