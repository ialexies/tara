# Tara — local dev infrastructure
#
# Spins up the data layer + dev tooling locally. Run from project root:
#   pnpm db:up         (start everything in the background)
#   pnpm db:down       (stop everything, keep data)
#   pnpm db:logs       (tail logs)
#   pnpm db:reset      (destroy data and restart with fresh DB)
#
# Services:
#   postgres  :5433  — primary database (host port; container listens on 5432)
#   redis     :6380  — cache + queue + holds (host port; container listens on 6379)
#   mailpit   :8025  — dev SMTP catch-all (web UI at http://localhost:8025)
#   adminer   :8081  — DB browser (http://localhost:8081)
#
# All services are on the `tara-net` network. Volumes are named so data
# survives `docker compose down` (but not `down -v`).

name: tara-dev

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: tara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tara
      POSTGRES_PASSWORD: tara
      POSTGRES_DB: tara_dev
      # tune for dev
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tara -d tara_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tara-net
    # Useful query logging in dev. Comment out if too noisy.
    command:
      - 'postgres'
      - '-c'
      - 'log_statement=mod'
      - '-c'
      - 'log_min_duration_statement=200'

  redis:
    image: redis:7.4-alpine
    container_name: tara-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tara-net
    command:
      - 'redis-server'
      - '--appendonly'
      - 'yes'
      - '--maxmemory'
      - '256mb'
      - '--maxmemory-policy'
      - 'allkeys-lru'

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: tara-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP — point your app's SMTP_HOST here in dev
      - '8025:8025' # Web UI — open http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
    networks:
      - tara-net

  adminer:
    image: adminer:4-standalone
    container_name: tara-adminer
    restart: unless-stopped
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tara-net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: tara-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Override localhost addresses with Docker service names
      DATABASE_URL: postgres://tara:tara@postgres:5432/tara_dev
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      WEB_URL: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tara-net

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        R2_PUBLIC_URL: https://pub-9b3c6c52ef10449a887ad24b73985c83.r2.dev
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    container_name: tara-web
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Server-side fetches go through the Docker network
      API_URL: http://api:4000
      WEB_URL: http://localhost:3000
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports:
      - '3000:3000'
    depends_on:
      - api
    networks:
      - tara-net

volumes:
  postgres-data:
    name: tara-postgres-data
  redis-data:
    name: tara-redis-data

networks:
  tara-net:
    name: tara-net
    driver: bridge
